<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аверс. Курьерство</title>
<style>
  :root {
    --blue-50: #e0f2fe;
    --blue-100: #bae6fd;
    --blue-200: #7dd3fc;
    --blue-300: #38bdf8;
    --blue-400: #0ea5e9;
    --blue-500: #0284c7;
    --blue-600: #0369a1;
    --blue-700: #075985;
    --text: #0f172a;
    --muted: #64748b;
    --white: #ffffff;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(2, 132, 199, 0.10);
    --shadow-hover: 0 6px 24px rgba(2, 132, 199, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #f0f9ff 0%, #e0f2fe 100%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ── Шапка ── */
  header {
    background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
    color: var(--white);
    padding: 20px 24px;
    box-shadow: 0 4px 18px rgba(2, 132, 199, 0.28);
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: '';
    position: absolute;
    top: -70px; right: -70px;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .header-title h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.2;
  }
  .header-title p {
    font-size: 0.8rem;
    opacity: 0.8;
    margin-top: 2px;
  }
  .btn-new {
    background: var(--white);
    color: var(--blue-600);
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  .btn-new:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
  .btn-new:active { transform: scale(0.97); }

  /* ── Контейнер ── */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 16px 0;
  }

  /* ── Статистика ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
  .stat-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 14px 12px;
    box-shadow: var(--shadow);
    text-align: center;
    transition: transform 0.25s, box-shadow 0.25s;
    animation: fadeUp 0.4s ease both;
  }
  .stat-card:nth-child(1) { animation-delay: 0.03s; }
  .stat-card:nth-child(2) { animation-delay: 0.06s; }
  .stat-card:nth-child(3) { animation-delay: 0.09s; }
  .stat-card:nth-child(4) { animation-delay: 0.12s; }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .stat-card .num {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--blue-500);
    line-height: 1.1;
  }
  .stat-card .label {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Панель управления списком ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .search-box {
    flex: 1;
    min-width: 180px;
    padding: 10px 16px;
    border: 1.5px solid var(--blue-100);
    border-radius: 22px;
    font-size: 0.88rem;
    font-family: inherit;
    outline: none;
    background: var(--white);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box:focus { border-color: var(--blue-300); box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
  .toolbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1.5px solid var(--blue-100);
    background: var(--white);
    color: var(--blue-600);
    font-size: 1rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
  }
  .icon-btn:hover { background: var(--blue-50); border-color: var(--blue-300); }

  /* ── Фильтры ── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .filter-btn {
    padding: 6px 14px;
    border-radius: 18px;
    border: 1.5px solid var(--blue-100);
    background: var(--white);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .filter-btn:hover { border-color: var(--blue-300); color: var(--blue-600); }
  .filter-btn.active {
    background: linear-gradient(135deg, var(--blue-400), var(--blue-500));
    color: var(--white);
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(2, 132, 199, 0.28);
  }
  .filter-btn .cnt {
    display: inline-block;
    margin-left: 4px;
    opacity: 0.75;
    font-weight: 700;
  }

  /* ── Список задач ── */
  .task-list { display: flex; flex-direction: column; gap: 10px; }

  .task-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--blue-200);
    transition: transform 0.2s, box-shadow 0.2s;
    animation: cardIn 0.35s ease both;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: start;
  }
  @media (max-width: 640px) {
    .task-card { grid-template-columns: 1fr; }
  }
  .task-card:hover { box-shadow: var(--shadow-hover); }
  .task-card.status-pending   { border-left-color: #f59e0b; }
  .task-card.status-transit   { border-left-color: var(--blue-400); }
  .task-card.status-delivered { border-left-color: #22c55e; opacity: 0.85; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .task-main { min-width: 0; }
  .task-address {
    font-weight: 700;
    font-size: 0.98rem;
    color: var(--blue-700);
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.3;
    word-break: break-word;
  }
  .task-payload {
    font-size: 0.86rem;
    color: var(--text);
    margin-top: 4px;
    line-height: 1.4;
    word-break: break-word;
  }
  .task-comment {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 3px;
    font-style: italic;
    word-break: break-word;
  }
  .task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
    align-items: center;
  }
  .pill {
    background: var(--blue-50);
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
    color: var(--blue-600);
    white-space: nowrap;
  }
  .pill.priority-high { background: #fef2f2; color: #dc2626; }
  .pill.priority-med  { background: #fffbeb; color: #d97706; }
  .pill.priority-low  { background: #f0fdf4; color: #16a34a; }

  .task-photo {
    margin-top: 8px;
    border-radius: 8px;
    overflow: hidden;
    max-width: 120px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .task-photo img { width: 100%; display: block; }

  .task-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  @media (max-width: 640px) {
    .task-side { flex-direction: row; align-items: center; flex-wrap: wrap; }
  }

  .task-status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .status-pending   .task-status-badge { background: #fef3c7; color: #b45309; }
  .status-transit   .task-status-badge { background: #e0f2fe; color: var(--blue-600); animation: pulse 1.8s infinite; }
  .status-delivered .task-status-badge { background: #dcfce7; color: #15803d; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .task-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  @media (max-width: 640px) {
    .task-actions { justify-content: flex-start; }
  }

  /* ── Кнопки ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue-400), var(--blue-500));
    color: var(--white);
    box-shadow: 0 4px 14px rgba(2, 132, 199, 0.32);
  }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(2, 132, 199, 0.42); transform: translateY(-1px); }
  .btn-outline {
    background: var(--white);
    border: 1.5px solid var(--blue-200);
    color: var(--blue-600);
  }
  .btn-outline:hover { background: var(--blue-50); border-color: var(--blue-300); }
  .btn-sm { padding: 6px 12px; font-size: 0.76rem; border-radius: 8px; }
  .btn-danger { background: #fef2f2; color: #dc2626; border: 1.5px solid #fecaca; }
  .btn-danger:hover { background: #fee2e2; }
  .btn-success { background: #f0fdf4; color: #16a34a; border: 1.5px solid #bbf7d0; }
  .btn-success:hover { background: #dcfce7; }

  /* ── График ── */
  .chart-section { margin-top: 22px; }
  .section-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--blue-600);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chart-wrap {
    background: var(--white);
    border-radius: var(--radius);
    padding: 20px 16px 10px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    height: 160px;
    gap: 8px;
  }
  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    height: 100%;
    justify-content: flex-end;
    gap: 5px;
  }
  .bar {
    width: 100%;
    max-width: 44px;
    background: linear-gradient(180deg, var(--blue-300), var(--blue-500));
    border-radius: 7px 7px 3px 3px;
    transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-height: 3px;
    position: relative;
  }
  .bar:hover { background: linear-gradient(180deg, var(--blue-400), var(--blue-600)); }
  .bar .count {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--blue-600);
  }
  .bar-label {
    font-size: 0.68rem;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
  }

  /* ── Пустое состояние ── */
  .empty {
    text-align: center;
    padding: 56px 16px;
    color: var(--muted);
    font-size: 0.9rem;
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .empty .icon { font-size: 2.6rem; margin-bottom: 10px; display: block; opacity: 0.45; }
  .empty .hint { font-size: 0.8rem; margin-top: 6px; opacity: 0.75; }

  /* ── Модалка ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.5);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    padding: 16px;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--white);
    border-radius: var(--radius);
    padding: 22px;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    transform: scale(0.94);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-head h3 {
    color: var(--blue-600);
    font-size: 1.05rem;
    font-weight: 700;
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.2s;
    line-height: 1;
  }
  .modal-close:hover { background: var(--blue-50); color: var(--blue-600); }

  .modal .preview {
    width: 100%; border-radius: 10px; margin: 12px 0;
    max-height: 300px; object-fit: contain; background: var(--blue-50);
  }

  /* ── Форма ── */
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 560px) { .form-row { grid-template-columns: 1fr; } }
  .form-group label {
    display: block;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--blue-600);
    margin-bottom: 4px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--blue-100);
    border-radius: 10px;
    font-size: 0.88rem;
    font-family: inherit;
    background: #f8fbff;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    color: var(--text);
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--blue-300);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    background: var(--white);
  }
  .form-group textarea { resize: vertical; min-height: 56px; }
  .full { grid-column: 1 / -1; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
  }

  /* ── Тост ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--blue-600);
    color: var(--white);
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(2,132,199,0.4);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 2000;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">
      <h1>📦 Аверс. Курьерство</h1>
      <p>Управление задачами курьера</p>
    </div>
    <button class="btn-new" onclick="openForm()">＋ Новая заявка</button>
  </div>
</header>

<div class="container">

  <!-- Статистика -->
  <div class="stats">
    <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">Всего</div></div>
    <div class="stat-card"><div class="num" id="stat-pending">0</div><div class="label">Ожидает</div></div>
    <div class="stat-card"><div class="num" id="stat-transit">0</div><div class="label">В пути</div></div>
    <div class="stat-card"><div class="num" id="stat-delivered">0</div><div class="label">Доставлено</div></div>
  </div>

  <!-- Поиск и действия -->
  <div class="toolbar">
    <input type="text" class="search-box" id="search" placeholder="🔍 Поиск по адресу или грузу...">
    <div class="toolbar-actions">
      <button class="icon-btn" title="Экспорт JSON" onclick="exportJSON()">⬇</button>
      <button class="icon-btn" title="Импорт JSON" onclick="document.getElementById('import-file').click()">⬆</button>
      <button class="icon-btn" title="Очистить всё" onclick="clearAll()">🗑</button>
      <input type="file" id="import-file" accept=".json" class="hidden" onchange="importJSON(event)">
    </div>
  </div>

  <!-- Фильтры -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Все <span class="cnt" id="c-all">0</span></button>
    <button class="filter-btn" data-filter="pending">Ожидает <span class="cnt" id="c-pending">0</span></button>
    <button class="filter-btn" data-filter="transit">В пути <span class="cnt" id="c-transit">0</span></button>
    <button class="filter-btn" data-filter="delivered">Доставлено <span class="cnt" id="c-delivered">0</span></button>
  </div>

  <!-- Список задач -->
  <div class="task-list" id="task-list"></div>

  <!-- График -->
  <div class="chart-section">
    <div class="section-title"><span>📊</span> Загрузка по дням (7 дней)</div>
    <div class="chart-wrap" id="chart"></div>
  </div>

</div>

<!-- Модалка: новая заявка -->
<div class="modal-overlay" id="form-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>➕ Новая заявка</h3>
      <button class="modal-close" onclick="closeForm()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="f-address">Адрес доставки *</label>
        <input type="text" id="f-address" placeholder="ул. Ленина, д. 10, кв. 5">
      </div>
      <div class="form-group">
        <label for="f-datetime">Дата и время</label>
        <input type="datetime-local" id="f-datetime">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="f-payload">Что передать</label>
        <input type="text" id="f-payload" placeholder="Документы, посылка, оборудование...">
      </div>
      <div class="form-group">
        <label for="f-priority">Приоритет</label>
        <select id="f-priority">
          <option value="low">Низкий</option>
          <option value="medium" selected>Средний</option>
          <option value="high">Высокий</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full">
        <label for="f-comment">Комментарий</label>
        <textarea id="f-comment" placeholder="Контактное лицо, подъезд, особенности..."></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full">
        <label for="f-photo">Фото (необязательно)</label>
        <input type="file" id="f-photo" accept="image/*" capture="environment">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeForm()">Отмена</button>
      <button class="btn btn-primary" onclick="addTask()">Добавить</button>
    </div>
  </div>
</div>

<!-- Модалка: фото -->
<div class="modal-overlay" id="photo-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>📷 Фотоотчёт</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <img class="preview" id="modal-preview" alt="Фото">
    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" onclick="removePhoto()">Удалить фото</button>
      <button class="btn btn-outline btn-sm" onclick="closeModal()">Закрыть</button>
    </div>
  </div>
</div>

<!-- Тост -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  Данные
// ═══════════════════════════════════════════
const STORAGE_KEY = 'avers_courier_tasks';
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let currentFilter = 'all';
let currentSearch = '';
let photoTargetId = null;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ═══════════════════════════════════════════
//  Рендер
// ═══════════════════════════════════════════
function render() {
  renderStats();
  renderCounts();
  renderChart();
  renderList();
}

function renderStats() {
  document.getElementById('stat-total').textContent = tasks.length;
  document.getElementById('stat-pending').textContent = tasks.filter(t => t.status === 'pending').length;
  document.getElementById('stat-transit').textContent = tasks.filter(t => t.status === 'transit').length;
  document.getElementById('stat-delivered').textContent = tasks.filter(t => t.status === 'delivered').length;
}

function renderCounts() {
  document.getElementById('c-all').textContent = tasks.length;
  document.getElementById('c-pending').textContent = tasks.filter(t => t.status === 'pending').length;
  document.getElementById('c-transit').textContent = tasks.filter(t => t.status === 'transit').length;
  document.getElementById('c-delivered').textContent = tasks.filter(t => t.status === 'delivered').length;
}

function renderChart() {
  const chart = document.getElementById('chart');
  chart.innerHTML = '';
  const days = [];
  const now = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0, 10);
    const label = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    const count = tasks.filter(t => t.datetime && t.datetime.slice(0, 10) === key).length;
    days.push({ label, count });
  }
  const max = Math.max(...days.map(d => d.count), 1);
  days.forEach(d => {
    const col = document.createElement('div');
    col.className = 'bar-col';
    const h = Math.max((d.count / max) * 100, d.count > 0 ? 8 : 2);
    col.innerHTML = `
      <div class="bar" style="height:${h}%">
        ${d.count > 0 ? `<span class="count">${d.count}</span>` : ''}
      </div>
      <div class="bar-label">${d.label}</div>
    `;
    chart.appendChild(col);
  });
}

function renderList() {
  const list = document.getElementById('task-list');
  let filtered = tasks.slice();

  if (currentFilter !== 'all') filtered = filtered.filter(t => t.status === currentFilter);
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    filtered = filtered.filter(t =>
      t.address.toLowerCase().includes(q) ||
      (t.payload || '').toLowerCase().includes(q) ||
      (t.comment || '').toLowerCase().includes(q)
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <span class="icon">📭</span>
        ${tasks.length === 0 ? 'Пока нет заявок' : 'Ничего не найдено'}
        <div class="hint">${tasks.length === 0 ? 'Нажми «Новая заявка» чтобы добавить' : 'Попробуй изменить фильтр или запрос'}</div>
      </div>`;
    return;
  }

  const order = { pending: 0, transit: 1, delivered: 2 };
  filtered.sort((a, b) => {
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    return (a.datetime || '').localeCompare(b.datetime || '');
  });

  list.innerHTML = filtered.map(t => {
    const statusLabel = { pending: 'Ожидает', transit: 'В пути', delivered: 'Доставлено' }[t.status];
    const priorityLabel = { low: 'Низкий', medium: 'Средний', high: 'Высокий' }[t.priority];
    const priorityClass = `priority-${t.priority}`;
    const dt = t.datetime ? new Date(t.datetime).toLocaleString('ru-RU', {
      day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
    }) : '—';

    return `
      <div class="task-card status-${t.status}" data-id="${t.id}">
        <div class="task-main">
          <div class="task-address">📍 ${esc(t.address)}</div>
          ${t.payload ? `<div class="task-payload">📦 ${esc(t.payload)}</div>` : ''}
          ${t.comment ? `<div class="task-comment">💬 ${esc(t.comment)}</div>` : ''}
          <div class="task-meta">
            <span class="pill">🕐 ${dt}</span>
            <span class="pill ${priorityClass}">${priorityLabel}</span>
          </div>
          ${t.photo ? `<div class="task-photo" onclick="openModal('${t.id}')"><img src="${t.photo}" alt="Фото"></div>` : ''}
        </div>
        <div class="task-side">
          <span class="task-status-badge">${statusLabel}</span>
          <div class="task-actions">
            ${t.status === 'pending' ? `<button class="btn btn-outline btn-sm" onclick="setStatus('${t.id}','transit')">🚚 В путь</button>` : ''}
            ${t.status === 'transit' ? `<button class="btn btn-success btn-sm" onclick="setStatus('${t.id}','delivered')">✅ Доставлено</button>` : ''}
            ${t.status === 'delivered' ? `<button class="btn btn-outline btn-sm" onclick="setStatus('${t.id}','pending')">↩ Вернуть</button>` : ''}
            <button class="btn btn-outline btn-sm" onclick="document.getElementById('photo-${t.id}').click()">📷</button>
            <input type="file" id="photo-${t.id}" accept="image/*" capture="environment" class="hidden" onchange="attachPhoto('${t.id}', event)">
            <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">✕</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ═══════════════════════════════════════════
//  Модалки
// ═══════════════════════════════════════════
function openForm() {
  document.getElementById('form-modal').classList.add('open');
  setTimeout(() => document.getElementById('f-address').focus(), 250);
}
function closeForm() {
  document.getElementById('form-modal').classList.remove('open');
  resetForm();
}
function openModal(id) {
  const t = tasks.find(x => x.id === id);
  if (!t || !t.photo) return;
  photoTargetId = id;
  document.getElementById('modal-preview').src = t.photo;
  document.getElementById('photo-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('photo-modal').classList.remove('open');
  photoTargetId = null;
}

// закрытие по клику на фон
document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', e => {
    if (e.target === ov) {
      ov.classList.remove('open');
      if (ov.id === 'form-modal') resetForm();
      if (ov.id === 'photo-modal') photoTargetId = null;
    }
  });
});

// Esc закрывает
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('form-modal').classList.remove('open');
    document.getElementById('photo-modal').classList.remove('open');
  }
});

// ═══════════════════════════════════════════
//  Действия
// ═══════════════════════════════════════════
function addTask() {
  const address = document.getElementById('f-address').value.trim();
  if (!address) { toast('Укажи адрес'); return; }
  const task = {
    id: uid(),
    address,
    datetime: document.getElementById('f-datetime').value || '',
    payload: document.getElementById('f-payload').value.trim(),
    priority: document.getElementById('f-priority').value,
    comment: document.getElementById('f-comment').value.trim(),
    photo: '',
    status: 'pending',
    createdAt: new Date().toISOString()
  };
  const file = document.getElementById('f-photo').files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = e => {
      task.photo = e.target.result;
      tasks.push(task);
      save();
      render();
      closeForm();
      toast('Заявка добавлена');
    };
    reader.readAsDataURL(file);
  } else {
    tasks.push(task);
    save();
    render();
    closeForm();
    toast('Заявка добавлена');
  }
}

function resetForm() {
  ['f-address','f-datetime','f-payload','f-comment','f-photo'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f-priority').value = 'medium';
}

function setStatus(id, status) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.status = status;
  save();
  render();
  toast(status === 'transit' ? '🚚 В пути' : status === 'delivered' ? '✅ Доставлено' : '↩ Возвращено');
}

function deleteTask(id) {
  if (!confirm('Удалить заявку?')) return;
  tasks = tasks.filter(t => t.id !== id);
  save();
  render();
  toast('Удалено');
}

function attachPhoto(id, event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const t = tasks.find(x => x.id === id);
    if (t) {
      t.photo = e.target.result;
      save();
      render();
      toast('Фото прикреплено');
    }
  };
  reader.readAsDataURL(file);
}

function removePhoto() {
  if (!photoTargetId) return;
  const t = tasks.find(x => x.id === photoTargetId);
  if (t) {
    t.photo = '';
    save();
    render();
    toast('Фото удалено');
  }
  closeModal();
}

function clearAll() {
  if (!confirm('Удалить ВСЕ заявки?')) return;
  tasks = [];
  save();
  render();
  toast('Все заявки удалены');
}

// ═══════════════════════════════════════════
//  Экспорт / Импорт
// ═══════════════════════════════════════════
function exportJSON() {
  const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `avers_courier_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('Экспортировано');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('Ожидается массив');
      tasks = data;
      save();
      render();
      toast(`Импортировано ${data.length}`);
    } catch (err) {
      toast('Ошибка импорта: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ═══════════════════════════════════════════
//  Фильтры и поиск
// ═══════════════════════════════════════════
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderList();
});

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  renderList();
});

// ═══════════════════════════════════════════
//  Тост
// ═══════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════
//  Старт
// ═══════════════════════════════════════════
render();
</script>

</body>
</html>
